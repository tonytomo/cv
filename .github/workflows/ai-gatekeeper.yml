name: AI Gatekeeper & Auto-Merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Deterministic checks: stop early if tests fail
      - name: Run Tests
        run: |
          if [ -f package.json ]; then npm test; fi
          if [ -f requirements.txt ]; then pytest; fi

      # 2. Run AI Code Review
      - name: AI Code Review
        id: ai_review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - << 'EOF'
          import os, json, subprocess, urllib.request

          pr_number = os.environ["PR_NUMBER"]
          api_key = os.environ["GEMINI_API_KEY"]

          diff = subprocess.check_output(["git", "diff", "origin/main...HEAD"]).decode("utf-8")
          if not diff.strip():
              print("No diff detected.")
              exit(0)

          diff_truncated = diff[:15000]

          prompt = f"""You are an automated code review gatekeeper. Review this git diff:
          ```diff
          {diff_truncated}
          ```
          Respond ONLY with a valid JSON object matching this schema:
          {{
            "passed": true/false,
            "feedback": "Concise summary of findings or issues in markdown format"
          }}
          Set passed=false only if there are critical bugs, security risks, or breaking flaws. Ignore minor stylistic preferences.
          """

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={api_key}"
          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"response_mime_type": "application/json"}
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  res_data = json.loads(resp.read().decode("utf-8"))
                  content = res_data["candidates"][0]["content"]["parts"][0]["text"]
                  result = json.loads(content)
          except Exception as e:
              result = {"passed": False, "feedback": f"Review execution error: {e}"}

          passed = result.get("passed", False)
          feedback = result.get("feedback", "No feedback provided.")

          comment_body = f"### 🤖 AI Gatekeeper Review\n\n**Verdict:** {'✅ Approved' if passed else '❌ Changes Requested'}\n\n{feedback}"
          subprocess.run(["gh", "pr", "comment", pr_number, "--body", comment_body], check=True)

          if not passed:
              exit(1)
          EOF

      # 3. Auto-merge if everything passed
      - name: Auto-Merge
        if: steps.ai_review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --auto
